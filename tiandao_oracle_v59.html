<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>問道天機 · 古意仙韻 V59</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#f3efe5;
  color:#25221d;
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  display:flex;
  justify-content:center;
}
main{
  width:min(92vw,540px);
  padding:42px 18px 72px;
  text-align:center;
}
h1{
  margin:0;
  font-size:30px;
  font-weight:500;
  letter-spacing:.2em;
}
.subtitle{
  margin:8px 0 30px;
  font-size:13px;
  color:#81796c;
  letter-spacing:.12em;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
select,button{
  width:100%;
  font-family:inherit;
  font-size:16px;
  padding:12px;
  border-radius:9px;
}
select{
  border:1px solid #bbb2a2;
  background:#fffdf7;
}
button{
  grid-column:1/-1;
  border:none;
  background:#29251f;
  color:#fff;
  letter-spacing:.2em;
  cursor:pointer;
}
button:active{transform:scale(.985)}
#result{margin-top:34px}
.date{
  color:#81796c;
  font-size:13px;
}
.hex{
  margin-top:14px;
  font-size:36px;
}
.name{
  margin-top:6px;
  font-size:25px;
  letter-spacing:.15em;
}
.structure,.detail{
  margin-top:8px;
  color:#71695c;
  font-size:13px;
}
.lines{
  width:96px;
  margin:19px auto;
}
.yang,.yin{
  height:7px;
  margin:7px 0;
}
.yang{background:#29251f}
.yin{
  display:flex;
  gap:15px;
}
.yin::before,.yin::after{
  content:"";
  flex:1;
  background:#29251f;
}
.moving{opacity:.4}
.poem{
  margin-top:25px;
  font-size:21px;
  line-height:2.05;
  letter-spacing:.06em;
}
.judge{
  display:inline-block;
  margin-top:24px;
  padding-top:13px;
  border-top:1px solid #c8c0b2;
  font-size:16px;
}
.note{
  margin-top:28px;
  color:#999;
  font-size:11px;
  line-height:1.6;
}

.realm-card{margin:15px auto 3px;padding:12px 14px;width:min(88%,360px);border-top:1px solid #c8c0b2;border-bottom:1px solid #c8c0b2;background:rgba(255,253,247,.45)}
.realm-title{font-size:16px;letter-spacing:.18em}.realm-stars{margin-top:6px;font-size:10px;letter-spacing:.16em;color:#8a7350}.realm-sense{margin-top:6px;font-size:12px;color:#81796c;letter-spacing:.05em}.seal{display:inline-block;margin-right:8px;padding:2px 5px;border:1px solid #8c6247;font-size:11px;color:#7c4f38;letter-spacing:.15em;transform:rotate(-2deg)}


/* =========================================================
   V19 · Procedural Realm Atmosphere
   只使用颜色、透明纹理与渐变；不引入图片资源。
========================================================= */
:root{
  --bg:#f3efe5; --bg2:#e9e1d1; --ink:#25221d; --muted:#81796c;
  --accent:#8c6247; --glow:rgba(181,146,91,.13); --mist:rgba(255,255,255,.18);
  --topic-glow:rgba(181,146,91,.10); --texture:.16; --depth:.1; --line-alpha:.04; --ring-alpha:.05;
}
body{
  position:relative; overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 12%,var(--glow),transparent 38%),
    linear-gradient(155deg,var(--bg),var(--bg2));
  color:var(--ink);
  transition:background 1.15s cubic-bezier(.2,.7,.2,1),color .85s ease;
}
body::before,body::after{
  content:"";position:fixed;inset:-12%;pointer-events:none;z-index:-1;
  transition:opacity 1.1s ease,background 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1);
}
body::before{
  opacity:var(--texture);
  background:
    /* 灵气等势线：纯公式生成 */
    repeating-radial-gradient(ellipse at calc(24% + var(--depth)*8%) calc(34% - var(--depth)*6%),
      transparent 0 calc(22px - var(--depth)*6px),
      var(--mist) calc(23px - var(--depth)*6px) calc(24px - var(--depth)*6px),
      transparent calc(25px - var(--depth)*6px) calc(48px - var(--depth)*10px)),
    /* 天地经纬：境界越高越可见 */
    repeating-linear-gradient(calc(116deg + var(--depth)*9deg),
      transparent 0 calc(54px - var(--depth)*12px),
      var(--topic-glow) calc(55px - var(--depth)*12px) calc(56px - var(--depth)*12px),
      transparent calc(57px - var(--depth)*12px) calc(108px - var(--depth)*20px));
  filter:blur(.2px);
}
body::after{
  opacity:.58;
  background:
    radial-gradient(circle at var(--focus-x,72%) var(--focus-y,28%),var(--topic-glow),transparent calc(34% - var(--depth)*9%)),
    radial-gradient(circle at 50% 52%,transparent 0 calc(28% - var(--depth)*5%),var(--glow) calc(45% + var(--depth)*8%),transparent 72%);
  filter:blur(18px);
}
main{position:relative;z-index:1}
h1,.hex,.name,.yang,.yin::before,.yin::after{transition:color .9s ease,background .9s ease,text-shadow .9s ease}
h1{color:var(--ink);text-shadow:0 0 28px var(--glow)}
.subtitle,.date,.structure,.detail,.realm-sense{transition:color .8s ease;color:var(--muted)}
select{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 34%,transparent);background:color-mix(in srgb,var(--bg) 84%,white 16%);transition:background .8s ease,border-color .8s ease,color .8s ease,box-shadow .8s ease}
select:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
button{background:var(--ink);transition:background .8s ease,color .8s ease,transform .18s ease,box-shadow .8s ease;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 13%,transparent)}
.realm-card{border-color:color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(4px);transition:background .9s ease,border-color .9s ease,box-shadow .9s ease}
.realm-stars,.seal{color:var(--accent);transition:color .8s ease,border-color .8s ease}
.seal{border-color:var(--accent)}
.yang,.yin::before,.yin::after{background:var(--ink)}
.judge{border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
#result{transition:opacity .32s ease,transform .45s cubic-bezier(.2,.7,.2,1),filter .45s ease}
body.theme-shifting #result{opacity:.18;transform:translateY(7px);filter:blur(2px)}
body.theme-shifting::before{transform:scale(1.025) rotate(.15deg);opacity:calc(var(--texture) * .55)}

body[data-dark="1"] select{background:color-mix(in srgb,var(--bg) 78%,white 7%);color:var(--ink)}
body[data-dark="1"] button{background:color-mix(in srgb,var(--accent) 72%,#08080a 28%);color:#fffaf0}
body[data-dark="1"] .realm-card{background:color-mix(in srgb,var(--bg) 74%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 18px 60px rgba(0,0,0,.14)}
body[data-dark="1"] .judge{background:rgba(255,255,255,.025)}
@media (prefers-reduced-motion:reduce){body,body::before,body::after,#result,*{transition-duration:.01ms!important}}


/* =========================================================
   V20 · iOS/Safari 背景修正
   修正高境界文字已变浅、但页面底色仍停留在浅色的问题。
   原因规避：不再让负 z-index 伪元素落到 body canvas 背后；
   同时避免 Safari 对复杂 calc() gradient stop 的兼容差异。
========================================================= */
html{min-height:100%;background:var(--bg)}
body{
  isolation:isolate;
  background-color:var(--bg) !important;
  background-image:linear-gradient(155deg,var(--bg),var(--bg2)) !important;
  background-attachment:fixed;
}
body::before,body::after{z-index:0 !important}
main{z-index:2 !important}
body::before{
  inset:-10%;
  opacity:var(--texture);
  background-image:
    repeating-radial-gradient(ellipse at var(--field-x,28%) var(--field-y,31%),
      transparent 0 var(--ring-a,20px),
      var(--mist) var(--ring-a,20px) var(--ring-b,21px),
      transparent var(--ring-b,21px) var(--ring-c,43px)),
    repeating-linear-gradient(var(--field-angle,118deg),
      transparent 0 var(--grid-a,48px),
      var(--topic-glow) var(--grid-a,48px) var(--grid-b,49px),
      transparent var(--grid-b,49px) var(--grid-c,96px));
}
body::after{
  inset:-8%;
  opacity:var(--aura-opacity,.42);
  background-image:
    radial-gradient(circle at var(--focus-x,72%) var(--focus-y,28%),var(--topic-glow) 0,transparent var(--focus-r,34%)),
    radial-gradient(circle at 50% 50%,transparent 0 var(--inner-r,28%),var(--glow) var(--outer-r,54%),transparent 76%);
}
/* 深境界必须由底色承担暗度，而不是只把文字反白 */
body[data-dark="1"]{
  background-color:var(--bg) !important;
  background-image:
    radial-gradient(circle at 50% 8%,var(--glow),transparent 42%),
    linear-gradient(155deg,var(--bg),var(--bg2)) !important;
}



/* =========================================================
   V21 · 叩问天机：随机天地纹理演化
   同一境界拥有不同的程序化“天地状态”；叩问期间连续演化，
   页面先虚化，待预言 seed 决定最终场后稳定并恢复清晰。
========================================================= */
body{--oracle-blur:0px;--oracle-scale:1;}
main{transition:filter .65s ease,opacity .65s ease,transform .8s cubic-bezier(.2,.75,.2,1)}
body.oracle-divining main{filter:blur(var(--oracle-blur,5px));opacity:.48;transform:scale(var(--oracle-scale,1.008))}
body.oracle-divining::before{transition:background-image .22s linear,opacity .22s linear,transform .5s ease;transform:scale(1.035) rotate(.25deg)}
body.oracle-divining::after{transition:background-image .28s linear,opacity .28s linear,transform .55s ease;transform:scale(1.05)}
body.oracle-divining button{pointer-events:none}
@media (prefers-reduced-motion:reduce){body.oracle-divining main{filter:none;opacity:.75;transform:none}}


/* V22 · 连续天机场 → 收敛 → 星辰光点 */
body::before,body::after{will-change:background-position,background-size,transform,opacity;transition:opacity .7s ease,transform .7s ease}
body.oracle-divining::before,body.oracle-divining::after{transition:none!important}
body.oracle-settling::before{transition:opacity .9s ease,transform 1.05s cubic-bezier(.2,.7,.2,1)!important;opacity:calc(var(--texture)*.38);transform:scale(1)}
body.oracle-settling::after{transition:opacity 1.1s ease,transform 1.1s ease!important;opacity:var(--star-opacity,.5);transform:scale(1)}
body.oracle-settling main{transition:filter 1.15s cubic-bezier(.22,.61,.36,1),opacity 1.15s ease,transform 1.15s ease;filter:blur(0);opacity:1;transform:scale(1)}
body:not(.oracle-divining)::before,body:not(.oracle-divining)::after{will-change:background-position,opacity,transform}


/* V25 · 大乘专属：公式万花镜金线场。其余七境不启用。 */
#mahayanaKaleido{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.15s ease;mix-blend-mode:screen}
body[data-realm="7"] #mahayanaKaleido{opacity:.72}
body[data-realm="7"]::before{opacity:.035!important}
body[data-realm="7"]::after{opacity:.14!important}
body.oracle-divining[data-realm="7"] #mahayanaKaleido{opacity:.94}
body.oracle-settling[data-realm="7"] #mahayanaKaleido{opacity:.82}
@media(prefers-reduced-motion:reduce){#mahayanaKaleido{transition:none}}

/* V27 · 双起卦模式：天机自显 / 遁演天机 */
.casting-panel{width:100%;display:grid;grid-template-columns:1fr;gap:8px;overflow:hidden;max-height:0;opacity:0;transform:translateY(-5px);transition:max-height .55s cubic-bezier(.22,.61,.36,1),opacity .42s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.casting-panel.open{max-height:150px;opacity:1;transform:translateY(0)}
.casting-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.casting-hint{font-size:11px;letter-spacing:.08em;color:var(--muted);opacity:.82;text-align:center;padding:1px 4px 2px}
#castingMode{width:100%}
.casting-panel select{min-width:0;width:100%}
@media(max-width:520px){.casting-row{gap:6px}.casting-panel select{font-size:12px;padding-left:8px;padding-right:22px}}

/* =========================================================
   V31 · Extensible literary app shell
========================================================= */
.app-shell{min-height:100dvh}
.literary-mode{
  display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;
  margin:0 0 12px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  border-radius:12px;background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .8s ease,border-color .8s ease,color .8s ease
}
.literary-mode label{font-size:12px;letter-spacing:.18em;color:var(--muted)}
.literary-mode select{padding:9px 10px;font-size:14px}
.mode-mark{margin-top:7px;font-size:11px;color:var(--muted);letter-spacing:.12em}


/* V33 — true two-page structure */
.app-page[hidden]{display:none!important}
.result-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
#backToAsk{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--text);font:inherit}
#resultRealmMark{font-size:11px;letter-spacing:.2em;color:var(--muted)}
#resultPage #result{min-height:240px}
#resultPage.page-enter #result{animation:pageReveal .9s cubic-bezier(.22,.61,.36,1) both}
@keyframes pageReveal{from{opacity:0;filter:blur(8px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}

#cloudVeil{position:fixed;inset:0;z-index:99999;pointer-events:none;visibility:hidden;opacity:0;overflow:hidden;background:color-mix(in srgb,var(--bg) 48%,transparent);transition:opacity .25s ease,visibility .25s}
#cloudVeil.on{visibility:visible;opacity:1}
.mist{position:absolute;width:78vmax;height:42vmax;border-radius:50%;opacity:0;filter:blur(var(--mistBlur,24px));background:
radial-gradient(ellipse at 36% 48%,color-mix(in srgb,var(--mistHi,#f5f2ea) 72%,transparent) 0 18%,transparent 57%),
radial-gradient(ellipse at 67% 53%,color-mix(in srgb,var(--mistMid,#b9c5ce) 55%,transparent) 0 23%,transparent 64%),
radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.m1{left:-48vmax;top:-9vmax}.m2{right:-50vmax;top:16vmax}.m3{left:-44vmax;bottom:-15vmax}.m4{right:-43vmax;bottom:10vmax}
#cloudVeil.on .m1{animation:mistL var(--cloudDur,3300ms) ease-in-out both}
#cloudVeil.on .m2{animation:mistR var(--cloudDur,3300ms) ease-in-out both}
#cloudVeil.on .m3{animation:mistL var(--cloudDur,3300ms) .12s ease-in-out both}
#cloudVeil.on .m4{animation:mistR var(--cloudDur,3300ms) .08s ease-in-out both}
.veilSigil{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;letter-spacing:.48em;color:var(--text);font-family:serif;font-size:15px}
#cloudVeil.on .veilSigil{animation:sigil var(--cloudDur,3300ms) ease both}
@keyframes mistL{0%{opacity:0;transform:translateX(-10%) scale(.8)}30%{opacity:.68}58%{opacity:.92;transform:translateX(70%) scale(1.18)}100%{opacity:0;transform:translateX(142%) scale(1.32)}}
@keyframes mistR{0%{opacity:0;transform:translateX(10%) scale(.8)}30%{opacity:.62}58%{opacity:.86;transform:translateX(-68%) scale(1.14)}100%{opacity:0;transform:translateX(-138%) scale(1.3)}}
@keyframes sigil{0%,25%,82%,100%{opacity:0}43%,64%{opacity:.72}}
html[data-realm-q="0"] #cloudVeil{--mistBlur:27px;--cloudDur:3300ms}
html[data-realm-q="1"] #cloudVeil{--mistBlur:24px;--cloudDur:3300ms}
html[data-realm-q="2"] #cloudVeil{--mistBlur:21px;--cloudDur:3300ms}
html[data-realm-q="3"] #cloudVeil{--mistBlur:18px;--cloudDur:3300ms}
html[data-realm-q="4"] #cloudVeil{--mistBlur:16px;--cloudDur:3300ms}
html[data-realm-q="5"] #cloudVeil{--mistBlur:14px;--cloudDur:3300ms}
html[data-realm-q="6"] #cloudVeil{--mistBlur:12px;--cloudDur:3300ms}
html[data-realm-q="7"] #cloudVeil{--mistBlur:9px;--cloudDur:3300ms;--mistHi:#dbc37e;--mistMid:#77643b}


/* V34 — instant departure, smooth reverse return */
.casting-stage{min-height:62vh;display:grid;place-items:center}
.casting-stage[hidden]{display:none!important}
.casting-center{text-align:center;opacity:.78}
.casting-title{font-family:serif;font-size:15px;letter-spacing:.20em;margin-top:14px;color:var(--muted);white-space:nowrap}
.casting-orbit{width:56px;height:56px;margin:auto;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);position:relative;animation:v34Orbit 3s linear infinite}
.casting-orbit:before,.casting-orbit:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);transform:rotate(45deg)}
.casting-orbit:after{inset:17px}
@keyframes v34Orbit{to{transform:rotate(360deg)}}

#askPage.v34-return{animation:v34Return .72s cubic-bezier(.22,.61,.36,1) both}
@keyframes v34Return{
  0%{opacity:0;transform:translateY(-7px) scale(.992);filter:blur(7px)}
  45%{opacity:.72;filter:blur(2px)}
  100%{opacity:1;transform:none;filter:none}
}
#cloudVeil.returning{transition:opacity .52s cubic-bezier(.22,.61,.36,1),visibility .52s}
#cloudVeil.returning .m1{animation:v34BackL 1.65s cubic-bezier(.22,.61,.36,1) both!important}
#cloudVeil.returning .m2{animation:v34BackR 1.65s cubic-bezier(.22,.61,.36,1) both!important}
#cloudVeil.returning .m3{animation:v34BackL 1.65s .025s cubic-bezier(.22,.61,.36,1) both!important}
#cloudVeil.returning .m4{animation:v34BackR 1.65s .015s cubic-bezier(.22,.61,.36,1) both!important}
@keyframes v34BackL{
  0%{opacity:0;transform:translateX(95%) scale(1.18)}
  28%{opacity:.72}
  55%{opacity:.86;transform:translateX(28%) scale(1.08)}
  100%{opacity:0;transform:translateX(-48%) scale(.9)}
}
@keyframes v34BackR{
  0%{opacity:0;transform:translateX(-95%) scale(1.18)}
  28%{opacity:.68}
  55%{opacity:.82;transform:translateX(-28%) scale(1.06)}
  100%{opacity:0;transform:translateX(48%) scale(.9)}
}
@media (prefers-reduced-motion:reduce){
 .casting-orbit{animation:none}
 #askPage.v34-return{animation:none}
}


/* =========================================================
   V38 · Jade mathematical prologue + seal-script aura
========================================================= */
body.intro-lock{overflow:hidden}
.intro-gate{position:fixed;inset:0;z-index:120000;display:grid;place-items:center;overflow:hidden;
 background:
 radial-gradient(circle at 48% 42%,rgba(255,255,255,.94),rgba(241,246,241,.88) 34%,rgba(221,232,224,.94) 72%),
 linear-gradient(135deg,#f8fbf7,#e4ede7 48%,#f7faf5);
 opacity:1;visibility:visible;transition:opacity 1.05s cubic-bezier(.22,.61,.36,1),filter 1.05s ease,visibility 1.05s}
.intro-gate::before{content:"";position:absolute;inset:-12%;background:
 radial-gradient(ellipse at 28% 31%,rgba(255,255,255,.72),transparent 32%),
 radial-gradient(ellipse at 74% 68%,rgba(174,203,184,.18),transparent 37%),
 repeating-linear-gradient(118deg,rgba(125,159,139,.035) 0 1px,transparent 1px 19px);
 filter:blur(2px);animation:jadeBreath 5.5s ease-in-out infinite alternate}
.intro-gate.leave{opacity:0;filter:blur(9px);visibility:hidden}
#jadeFormula{position:absolute;inset:0;width:100%;height:100%;opacity:.33;mix-blend-mode:multiply}
.intro-vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 34%,rgba(95,124,105,.08) 78%,rgba(70,95,78,.13))}
.seal-title{position:relative;z-index:3;display:flex;gap:.13em;align-items:center;justify-content:center;
 color:#5b4722;font-family:"STKaiti","Kaiti SC","Songti SC","Noto Serif CJK SC",serif;
 font-size:clamp(42px,11vw,72px);font-weight:500;letter-spacing:.08em;
 text-shadow:0 0 7px rgba(255,241,190,.92),0 0 22px rgba(218,173,70,.52),0 0 54px rgba(176,128,38,.30);
 animation:sealAppear 3.05s cubic-bezier(.22,.61,.36,1) both}
.seal-glyph{display:inline-block;transform:scaleX(.82);filter:contrast(1.12)}
.seal-aura{position:absolute;z-index:2;width:190px;height:190px;border-radius:50%;filter:blur(.1px)}
.seal-aura i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(211,166,67,.28);
 box-shadow:0 0 18px rgba(230,190,92,.24),inset 0 0 20px rgba(244,214,133,.13)}
.seal-aura i:nth-child(1){animation:auraOrbit 3.6s linear infinite}
.seal-aura i:nth-child(2){inset:17px;animation:auraOrbit 2.8s linear infinite reverse;transform:rotate(58deg)}
.seal-aura i:nth-child(3){inset:34px;border-style:dotted;animation:auraPulse 2.1s ease-in-out infinite}
.seal-aura::before,.seal-aura::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;
 background:rgba(255,239,177,.94);box-shadow:0 0 9px rgba(237,194,87,.92),0 0 24px rgba(201,150,48,.78)}
.seal-aura::before{animation:spiritA 2.4s linear infinite}.seal-aura::after{animation:spiritB 3.1s linear infinite reverse}

 animation:v46PageArrive 1.12s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes v46PageArrive{
 0%{opacity:0;transform:translateY(3px);filter:blur(1.5px)}
 48%{opacity:.42;filter:blur(.55px)}
 100%{opacity:1;transform:none;filter:none}
}


/* =========================================================
   V47 · 三幕节奏
   1) 文字完整呈现 1.0s
   2) 文字在 0.5s 内融尽
   3) 字完全消失后，背景才开始缓慢过渡到第一页
========================================================= */

/* 启动画面先保持自身材质；背景切换由独立阶段控制 */
.intro-gate{
 opacity:1!important;
 visibility:visible!important;
 filter:none!important;
 transition:none!important;
}
.intro-gate.text-out .seal-title{
 animation:v47TextOut .50s cubic-bezier(.42,0,.22,1) both!important;
}
.intro-gate.text-out .seal-glyph{
 animation:v47GlyphOut .50s cubic-bezier(.42,0,.22,1) both!important;
}
@keyframes v47TextOut{
 0%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}
 38%{opacity:.76;transform:translate(-50%,-50%) scale(1.002);filter:blur(.15px)}
 76%{opacity:.23;transform:translate(-50%,-50%) scale(1.006);filter:blur(.75px)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.010);filter:blur(2.5px)}
}
@keyframes v47GlyphOut{
 0%{
   color:color-mix(in srgb,var(--text,#342f28) 68%,#b39255 32%);
   -webkit-text-fill-color:color-mix(in srgb,var(--text,#342f28) 68%,#b39255 32%);
 }
 58%{
   color:color-mix(in srgb,var(--paper,#f4f1e8) 62%,#c5ad77 38%);
   -webkit-text-fill-color:color-mix(in srgb,var(--paper,#f4f1e8) 62%,#c5ad77 38%);
 }
 100%{color:transparent;-webkit-text-fill-color:transparent}
}

/* 第三幕：文字已经不存在，才让序章材质透明化，露出同色系第一页 */
.intro-gate.bg-shift{
 transition:opacity 2.80s cubic-bezier(.22,.61,.36,1),
            filter 2.80s cubic-bezier(.22,.61,.36,1)!important;
 opacity:0!important;
 filter:blur(1.1px)!important;
}
.intro-gate.bg-shift::before,
.intro-gate.bg-shift .intro-vignette{
 opacity:0!important;
 transition:opacity 2.65s cubic-bezier(.22,.61,.36,1)!important;
}
.intro-gate.bg-shift #jadeFormula{
 opacity:0!important;
 transition:opacity 2.45s cubic-bezier(.22,.61,.36,1)!important;
}

/* 第一页在第三幕中后段才显出来，避免文字消失和页面变化同时发生 */
#askPage.v47-arrive{
 animation:v47PageIn 2.65s cubic-bezier(.22,.61,.36,1) both!important;
}
@keyframes v47PageIn{
 0%,16%{opacity:0;filter:blur(1px);transform:translateY(2px)}
 55%{opacity:.48;filter:blur(.35px)}
 100%{opacity:1;filter:none;transform:none}
}

function seededNumber(seed){
  return Math.abs(Math.sin(seed*12.9898+78.233)*43758.5453)%1;
}

function spick(arr,seed){
  return arr[Math.floor(seededNumber(seed)*arr.length)];
}

function dateSeed(d){
  return d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();
}

  if(seededNumber(seed)<0.70){
    return spick(curated,seed+17);
  }

  const pool=RARE_CHAR[type];

  for(let k=0;k<12;k++){

    const a=spick(
      pool.head,
      seed+31+k*7
    );

    const b=spick(
      pool.tail,
      seed+47+k*11
    );

    const w=a+b;

    if(
      a!==b &&
      !BAD_PAIR.has(w) &&
      [...w].length===2
    ){
      return w;
    }
  }

  return spick(curated,seed+97);
}

const DARK_CHARS=["阴","冥","晦","黯","险","忧","危","凶","怛","悒","困","阻","幽"];

/*
  负面词不再只用固定概率控制，而采用三层机制：

  A. 单词级：不同风格有基础保留率
  B. 卦象级：坎、艮等允许略多，乾、离等更少
  C. 全诗级：限制整首诗的负面双字槽总数

  目标：
  “玄奥”可以神秘，但不等于阴暗。
*/

const DARK_BASE_RATE={
  plain:0.01,
  classic:0.03,
  deep:0.08,
  arcane:0.12
};

const DARK_GUA_BIAS={
  乾:-0.05,
  兑:-0.03,
  离:-0.04,
  震: 0.00,
  巽:-0.01,
  坎: 0.10,
  艮: 0.04,
  坤: 0.01
};

/*
  整首允许的“明显负面双字槽”上限。
  plain/classic 通常为 0；
  arcane 一般最多 1，坎卦最多 2。
*/
const DARK_SLOT_LIMIT={
  plain:0,
  classic:0,
  deep:1,
  arcane:1
};

function hasDarkChar(word){
  return DARK_CHARS.some(ch=>word.includes(ch));
}

function darkKeepRate(gua,style){
  let r=
    DARK_BASE_RATE[style]
    +(DARK_GUA_BIAS[gua]||0);

  return Math.max(0,Math.min(0.28,r));
}

function softenDark(word,original,gua,style,seed){

  if(!hasDarkChar(word)) return word;

  if(
    seededNumber(seed)
    <
    darkKeepRate(gua,style)
  ){
    return word;
  }

  return original;
}


/*
  对整首诗再做一次“负面预算”。
  超过预算的槽位恢复为原始场景词。

  坎参与时：
  deep 最多 1 个负面槽；
  arcane 最多 2 个负面槽。

  其他卦：
  deep/arcane 通常最多 1 个。
*/

function applyDarkBudget(
  upperRare,
  lowerRare,
  upperOriginal,
  lowerOriginal,
  hex,
  style,
  seed
){

  let limit=DARK_SLOT_LIMIT[style];

  if(
    style==="arcane" &&
    (hex.upper==="坎" || hex.lower==="坎")
  ){
    limit=2;
  }

  const slots=[
    ["u","sky"],
    ["u","land"],
    ["u","mind"],
    ["u","act"],
    ["u","mood"],
    ["l","sky"],
    ["l","land"],
    ["l","mind"],
    ["l","act"],
    ["l","mood"]
  ];

  /*
    用确定性顺序打散，
    防止总是保留第一个负面词。
  */
  slots.sort((a,b)=>{
    const sa=
      seededNumber(seed+a[0].charCodeAt(0)+a[1].charCodeAt(0));
    const sb=
      seededNumber(seed+b[0].charCodeAt(0)+b[1].charCodeAt(0));
    return sa-sb;
  });

  let kept=0;

  for(const [side,key] of slots){

    const obj=
      side==="u" ? upperRare : lowerRare;

    const original=
      side==="u" ? upperOriginal : lowerOriginal;

    if(!hasDarkChar(obj[key])) continue;

    if(kept<limit){
      kept++;
    }else{
      obj[key]=original[key];
    }
  }
}

  “幽”本身不总是负面：
  幽兰、幽谷、幽怀可以是审美意象。
  因此当“幽”出现在下列白名单词中时，不算负面。
*/

const DARK_WHITELIST=new Set([
  "幽兰","幽谷","幽怀","幽思","幽径","幽潭",
  "幽涧","幽岩","幽岫","幽光","幽生","幽通",
  "幽开","幽达","幽境","幽芳","幽篁","幽篁"
]);

const _hasDarkCharRaw=hasDarkChar;

hasDarkChar=function(word){
  if(DARK_WHITELIST.has(word)) return false;
  return _hasDarkCharRaw(word);
};

/*
  神祇词触发率。
  古雅仅偶见；玄奥显著出现。
*/

const DEITY_RATE={
  plain:0.00,
  classic:0.04,
  deep:0.16,
  arcane:0.34
};


function deityWord(gua,style,seed,slot){

  if(seededNumber(seed)>realmRate("deity")){
    return null;
  }

  const type=
    spick(
      GUA_DEITY[gua],
      seed+1901
    );

  /*
    slot=core 时直接使用神名；
    其他槽位使用与该神祇同语义场的词。
  */

  if(slot==="core"){
    return spick(
      DEITY_CORE[type],
      seed+1913
    );
  }

  const field=
    DEITY_FIELD[type];

  const pool=
    field[slot] || field.omen;

  return spick(
    pool,
    seed+1931
  );
}


/*
  给一首诗构建“神祇主题”。
  一旦触发，同一首中的多个词会来自同一个神祇语义场，
  从而形成真正的呼应，而不是神名随机散落。
*/

function buildDeityTheme(gua,style,seed){

  if(seededNumber(seed+2003)>realmRate("deity")){
    return null;
  }

  const type=
    spick(
      GUA_DEITY[gua],
      seed+2011
    );

  return{
    type:type,
    core:spick(DEITY_CORE[type],seed+2027),
    sky:spick(DEITY_FIELD[type].sky,seed+2039),
    place:spick(DEITY_FIELD[type].place,seed+2053),
    rite:spick(DEITY_FIELD[type].rite,seed+2069),
    omen:spick(DEITY_FIELD[type].omen,seed+2081)
  };
}

/* =========================================================
   每种风格都有独立 salt
   修复旧版最大 bug：
   旧 seed 不含 style，导致绝大多数词完全相同。
========================================================= */

const STYLE_SALT={
  plain:101,
  classic:307,
  deep:701,
  arcane:1301
};


/* =========================================================
   取卦
   卦只由 日期 + 事项 决定。
   改风格不会改卦，只改“辞”。
========================================================= */

function getHexagram(date,topic){

  const d=dateSeed(date);
  const t=TOPIC[topic].seed;

  const upperIndex=Math.abs(d)%8;
  const lowerIndex=Math.abs(d*3+t*7)%8;

  const upper=ORDER[upperIndex];
  const lower=ORDER[lowerIndex];

  return{
    upper,
    lower,
    name:HEXAGRAMS[lower][upperIndex],
    moving:Math.abs(d+t*11)%6+1
  };
}


/* =========================================================
   六爻图
========================================================= */

function drawLines(lower,upper,moving){

  const bits=[
    ...GUA[lower].bits,
    ...GUA[upper].bits
  ];

  let html="";

  for(let i=5;i>=0;i--){

    const cls=
      i===moving-1
      ? " moving"
      : "";

    html+=bits[i]===1
      ? `<div class="yang${cls}"></div>`
      : `<div class="yin${cls}"></div>`;
  }

  return html;
}


/* =========================================================
   选择韵部
========================================================= */

function rhymeType(upper,lower){

  if(upper==="坎"||lower==="坎")
    return "deep";

  if(upper==="震"||lower==="震")
    return "change";

  if(upper==="离"||upper==="乾")
    return "bright";

  if(upper==="艮"||lower==="坤")
    return "calm";

  return "distant";
}


/* =========================================================
   变体
   同一天同一事项的“卦”不变；
   每按一次“观象”，只切换同一卦下的辞。
========================================================= */

let variant=0;

/*
  最终成诗重生成盐值。
  卦象本身不变，只改变措辞。
*/
let rerollSalt=0;

function resetVariant(){
  variant=0;
  divine(false);
}


/* =========================================================
   语义上下文

   核心修复：
   1. scene 是成组对象，不再各槽独立乱抽。
   2. style 用同一个 scene 的不同表述。
   3. topic 也是成组变化。
   4. styleSalt 进入所有词的选择。
========================================================= */

function buildContext(hex,topic,style,date){

  const base=
    dateSeed(date)
    +TOPIC[topic].seed*101
    +hex.moving*17
    +ORDER.indexOf(hex.upper)*29
    +ORDER.indexOf(hex.lower)*43
    +variant*211
    +rerollSalt*977;

  const styleSeed=
    base+STYLE_SALT[style];

  /*
    sceneIndex 不完全依赖 style：
    保留同一卦的核心语义，
    但 variant 可切换同卦的另一组意象。
  */

  const upperScenes=SCENE[hex.upper];
  const lowerScenes=SCENE[hex.lower];
  const topicScenes=TOPIC_SCENE[topic];

  const upperScene=
    upperScenes[
      Math.abs(base+variant)%upperScenes.length
    ][style];

  const lowerScene=
    lowerScenes[
      Math.abs(base*3+variant)%lowerScenes.length
    ][style];

  const topicScene=
    topicScenes[
      Math.abs(base*5+variant)%topicScenes.length
    ][style];

  /*
    数组固定位置：
    scene:
      0 sky
      1 land
      2 mind
      3 act
      4 mood

    topic:
      0 key
      1 noun
      2 act
      3 aim
  */

  const aux=STYLE_AUX[style];

  const rhymeName=
    rhymeType(hex.upper,hex.lower);

  const rhymePool=
    RHYME[rhymeName][style];

  /*
    第二层词汇扰动：
    根据风格概率，用“生僻单字造双词”替换部分双字槽。
    仍然保持语义类别受上下卦控制。
  */

  const rareBase=styleSeed+variant*313;

  const upperRare={
    sky:mystify2(upperScene[0],hex.upper,style,rareBase+1),
    land:mystify2(upperScene[1],hex.upper,style,rareBase+2),
    mind:mystify2(upperScene[2],hex.upper,style,rareBase+3),
    act:mystify2(upperScene[3],hex.upper,style,rareBase+4),
    mood:mystify2(upperScene[4],hex.upper,style,rareBase+5)
  };

  const lowerRare={
    sky:mystify2(lowerScene[0],hex.lower,style,rareBase+11),
    land:mystify2(lowerScene[1],hex.lower,style,rareBase+12),
    mind:mystify2(lowerScene[2],hex.lower,style,rareBase+13),
    act:mystify2(lowerScene[3],hex.lower,style,rareBase+14),
    mood:mystify2(lowerScene[4],hex.lower,style,rareBase+15)
  };

  const upperOriginal={
    sky:upperScene[0],
    land:upperScene[1],
    mind:upperScene[2],
    act:upperScene[3],
    mood:upperScene[4]
  };

  const lowerOriginal={
    sky:lowerScene[0],
    land:lowerScene[1],
    mind:lowerScene[2],
    act:lowerScene[3],
    mood:lowerScene[4]
  };

  applyDarkBudget(
    upperRare,
    lowerRare,
    upperOriginal,
    lowerOriginal,
    hex,
    style,
    rareBase+2603
  );

  /*
    神祇主题优先取上卦；若未触发，再尝试下卦。
  */
  let deityTheme=
    buildDeityTheme(hex.upper,style,rareBase+3001) ||
    buildDeityTheme(hex.lower,style,rareBase+3101);

  /*
    神祇层同样受负面限制。
    “玄冥”等词只在少数情况下保留，不因为神祇词库而绕过限流。
  */
  if(deityTheme){

    const deityGua=
      deityTheme===null ? hex.upper : hex.upper;

    for(const key of ["core","sky","place","rite","omen"]){

      if(
        hasDarkChar(deityTheme[key]) &&
        seededNumber(rareBase+3301+key.length)
        >
        darkKeepRate(hex.upper,style)
      ){
        deityTheme[key]=
          key==="omen" ? "灵曜" :
          key==="place" ? "玄圃" :
          key==="sky" ? "天潢" :
          key==="rite" ? "云旗" :
          "太一";
      }
    }
  }

  return{
    upper:upperRare,

    lower:lowerRare,

    deity:deityTheme,

    topic:{
      key:topicScene[0],
      noun:topicScene[1],
      act:topicScene[2],
      aim:topicScene[3]
    },

    bridge1:spick(aux.bridge,styleSeed+11),
    bridge2:spick(aux.bridge,styleSeed+19),

    turn1:spick(aux.turn,styleSeed+23),
    turn2:spick(aux.turn,styleSeed+31),

    result1:spick(aux.result,styleSeed+37),
    result2:spick(aux.result,styleSeed+41),

    rhyme:[
      spick(rhymePool,styleSeed+47),
      spick(rhymePool,styleSeed+53),
      spick(rhymePool,styleSeed+59),
      spick(rhymePool,styleSeed+61)
    ],

    template:
      Math.floor(
        seededNumber(styleSeed+71)*4
      )
  };
}


/* =========================================================
   七言生成

   严格：
   2字 + 2字 + 2字 + 1字 = 7字

   风格变化时：
   scene / topic / aux / rhyme / template 都会变。
========================================================= */

function poemOnce(hex,topic,style,date){

  const c=
    buildContext(
      hex,
      topic,
      style,
      date
    );

  const [r1,r2,r3,r4]=c.rhyme;

  /*
    神祇主题触发时：
    只替换一部分双字槽，保持事项语义仍然存在。
    同一主题的 神名 / 神境 / 仪仗 / 瑞象 会互相呼应。
  */
  if(c.deity){

    if(style==="arcane"){
      c.upper.sky=c.deity.core;
      c.lower.land=c.deity.place;
      c.upper.mood=c.deity.omen;
      c.lower.mind=c.deity.rite;
    }

    else if(style==="deep"){
      c.upper.sky=c.deity.sky;
      c.lower.land=c.deity.place;
    }

    else if(style==="classic"){
      c.upper.sky=c.deity.sky;
    }
  }

  const templates=[

    [
      `${c.upper.sky}${c.lower.land}${c.upper.mood}${r1}`,
      `${c.topic.noun}${c.upper.mind}${c.bridge1}${r2}`,
      `${c.topic.key}${c.lower.mind}${c.turn1}${r3}`,
      `${c.topic.act}${c.lower.act}${c.result1}${r4}`
    ],

    [
      `${c.lower.sky}${c.upper.land}${c.lower.mood}${r1}`,
      `${c.topic.key}${c.lower.mind}${c.bridge2}${r2}`,
      `${c.topic.noun}${c.upper.mind}${c.turn2}${r3}`,
      `${c.topic.act}${c.upper.act}${c.result2}${r4}`
    ],

    [
      `${c.upper.sky}${c.upper.land}${c.lower.mood}${r1}`,
      `${c.topic.noun}${c.lower.mind}${c.bridge1}${r2}`,
      `${c.topic.key}${c.upper.mind}${c.turn2}${r3}`,
      `${c.lower.act}${c.topic.act}${c.result1}${r4}`
    ],

    [
      `${c.lower.sky}${c.lower.land}${c.upper.mood}${r1}`,
      `${c.topic.key}${c.upper.mind}${c.bridge2}${r2}`,
      `${c.topic.noun}${c.lower.mind}${c.turn1}${r3}`,
      `${c.upper.act}${c.topic.act}${c.result2}${r4}`
    ]
  ];

  return templates[c.template];
}

/*
  独立韵脚池。
  要求韵脚本身也不能和前 24 个字重复。
*/
const UNIQUE_RHYME_POOL=[
  "明","晴","清","宁","星","青","庭","亭","汀","萍","馨","铭","晶","莹","经","灵","冥",
  "安","山","还","澜","闲","宽","寒","关","湾","环","颜","艰","攀","斓","潺","寰","玄",
  "深","心","临","寻","吟","沉","阴","林","琴","襟","音","金","森","岑","斟","箴",
  "风","空","中","通","终","鸿","穹","东","宫","钟","松","龙","蓬","蒙","融","雄",
  "遥","高","潮","霄","涛","昭","摇","箫","桥","宵","瑶","寥","迢","雕","飘","韶",
  "生","成","荣","盈","昌","嘉","和","祥","瑞","贞","亨","泰","升","达","朗","华","真","元"
];


function charsOf(s){
  return [...s];
}


function wordIsUsable(word,used){

  const c=charsOf(word);

  return(
    c.length===2 &&
    c[0]!==c[1] &&
    !used.has(c[0]) &&
    !used.has(c[1])
  );
}


/*
  为一个冲突的双字槽找替代词。
  只重算这个槽。
*/
function chooseUniqueReplacement(
  original,
  gua,
  style,
  used,
  seed
){

  /*
    优先尝试原有风格 + 对应卦象词，
    再尝试其他风格中的广义候选，
    以最大化成功率。
  */
  const pool=[
    ...(UNIQUE_GUA_POOL[gua]||[]),
    ...(UNIQUE_REPAIR_POOL[style]||[]),
    ...UNIQUE_REPAIR_POOL.arcane,
    ...UNIQUE_REPAIR_POOL.classic,
    ...UNIQUE_REPAIR_POOL.deep,
    ...UNIQUE_REPAIR_POOL.plain
  ];

  const n=pool.length;

  for(let k=0;k<n;k++){

    const candidate=
      pool[
        Math.floor(
          seededNumber(seed+k*41)*n
        )
      ];

    if(wordIsUsable(candidate,used)){
      return candidate;
    }
  }

  /*
    极端保险：使用两个尚未出现、且偏古雅的汉字组合。
    只有当所有正常双字词都冲突时才会走到这里。
  */
  const fallbackChars=[
    ..."霁曦曜晖皓赩昭晶霭霏霄暝曀飙飔飏澹泠湛洄沧澜渊潭涘浦汀渚崇峻危层巍崒岫巘嶂阿皋兰蕙芷蘅荃荪葭薜桂椒玄清素冲逸澄静灵遐徂涉抱守含虚葆知观初渐潜将微启显亨泰定昌"
  ].filter((ch,i,a)=>a.indexOf(ch)===i);

  const available=
    fallbackChars.filter(ch=>!used.has(ch));

  if(available.length>=2){
    return available[0]+available[1];
  }

  return original;
}


/*
  修复单个韵脚，只改一个字。
*/
function chooseUniqueRhyme(
  original,
  used,
  seed
){

  const pool=[
    original,
    ...UNIQUE_RHYME_POOL
  ];

  for(let k=0;k<pool.length;k++){

    const ch=
      pool[
        Math.floor(
          seededNumber(seed+k*53)*pool.length
        )
      ];

    if(
      [...ch].length===1 &&
      !used.has(ch)
    ){
      return ch;
    }
  }

  /*
    极端保险字符。
  */
  const fallback=
    [..."祺祉祯祐穆晟晏煦昶翊璟璨颢颐颂"];

  for(const ch of fallback){
    if(!used.has(ch)) return ch;
  }

  return original;
}


/*
  核心算法：
  按最终阅读顺序处理四句。
  第一次出现的字优先保留；
  后续冲突只修复所在双字槽或韵脚。
*/
function repairPoemUniqueChars(
  lines,
  hex,
  style,
  seed
){

  const used=new Set();
  const repaired=[];

  for(let lineIndex=0;lineIndex<lines.length;lineIndex++){

    const chars=[...lines[lineIndex]];

    const originalSlots=[
      chars.slice(0,2).join(""),
      chars.slice(2,4).join(""),
      chars.slice(4,6).join("")
    ];

    const rhyme=chars[6];

    const newSlots=[];

    for(let slotIndex=0;slotIndex<3;slotIndex++){

      let word=
        originalSlots[slotIndex];

      const wc=charsOf(word);

      const conflict=
        wc.length!==2 ||
        wc[0]===wc[1] ||
        used.has(wc[0]) ||
        used.has(wc[1]);

      if(conflict){

        /*
          上半句更偏上卦，下半句更偏下卦。
          这里只决定替换词库，不改变卦象。
        */
        const gua=
          slotIndex===0
          ? hex.upper
          : hex.lower;

        word=
          chooseUniqueReplacement(
            word,
            gua,
            style,
            used,
            seed
              +lineIndex*1009
              +slotIndex*137
          );
      }

      for(const ch of charsOf(word)){
        used.add(ch);
      }

      newSlots.push(word);
    }

    /*
      韵脚最后处理。
      与本句及前三句所有字都不能重复。
    */
    let newRhyme=rhyme;

    if(
      !newRhyme ||
      used.has(newRhyme)
    ){
      newRhyme=
        chooseUniqueRhyme(
          rhyme,
          used,
          seed+lineIndex*2017+1703
        );
    }

    used.add(newRhyme);

    repaired.push(
      newSlots.join("")+newRhyme
    );
  }

  return repaired;
}


/*
  最终绝对唯一性检查：
  28 字必须 = 28 个不同汉字。
*/
function allCharsUnique(lines){

  const chars=
    [...lines.join("")];

  return(
    chars.length===28 &&
    new Set(chars).size===28
  );
}


/* =========================================================
   最终成诗词频审查

   这是最后一道“硬门槛”：
   先生成整首诗，再统计最终文本。
   不合格则改变 rerollSalt 自动重生成；
   卦象、动爻、事项均不改变。
========================================================= */

/*
  明显负面单字。
  “幽”单独处理：它常是审美词，不与“阴、冥”同权重。
*/
const FINAL_NEGATIVE_WEIGHT={
  "阴":2.0,
  "冥":2.0,
  "晦":1.8,
  "黯":1.8,
  "险":1.6,
  "忧":1.5,
  "危":1.5,
  "凶":2.2,
  "怛":1.6,
  "悒":1.4,
  "困":1.4,
  "阻":1.3,
  "幽":0.35
};

/*
  单个明显负面字在一首四句诗中的最大出现次数。
  即使是坎卦，也避免“冥冥、阴阴、险险”式重复。
*/
const FINAL_CHAR_MAX={
  "阴":1,
  "冥":1,
  "晦":1,
  "黯":1,
  "险":1,
  "忧":1,
  "危":1,
  "凶":1,
  "怛":1,
  "悒":1,
  "困":1,
  "阻":1,
  "幽":2
};


/*
  按最终四句文本统计每个汉字。
*/
function countChars(lines){

  const freq={};

  for(const ch of lines.join("")){
    if(/[\u3400-\u9fff]/.test(ch)){
      freq[ch]=(freq[ch]||0)+1;
    }
  }

  return freq;
}


/*
  统计前三个双字槽。
  韵脚是第 7 字，不纳入双字词重复检查。
*/
function getTwoCharSlots(lines){

  const words=[];

  for(const line of lines){

    const chars=[...line];

    words.push(
      chars.slice(0,2).join(""),
      chars.slice(2,4).join(""),
      chars.slice(4,6).join("")
    );
  }

  return words;
}

function countTwoCharSlots(lines){

  const freq={};

  for(const w of getTwoCharSlots(lines)){
    freq[w]=(freq[w]||0)+1;
  }

  return freq;
}


/*
  最终允许的负面“总分”。

  神秘感主要应来自：
  天象 / 神祇 / 古地 / 玄理，
  而不是大量负面字。

  坎卦可以略多，但仍有硬上限。
*/
function finalNegativeBudget(hex,style){

  let budget={
    plain:0.35,
    classic:0.75,
    deep:1.70,
    arcane:2.35
  }[style];

  if(hex.upper==="坎" || hex.lower==="坎"){
    budget+=0.85;
  }

  return budget;
}


/*
  对候选诗做完整审查。
*/
function inspectPoem(lines,hex,style){

  const chars=countChars(lines);
  const words=countTwoCharSlots(lines);

  let negativeScore=0;
  let hardFail=false;

  /*
    最终硬规则：
    全诗任何汉字只允许出现一次。
  */
  const allChars=[...lines.join("")];

  if(
    allChars.length!==28 ||
    new Set(allChars).size!==28
  ){
    hardFail=true;
  }

  for(const [ch,weight] of Object.entries(FINAL_NEGATIVE_WEIGHT)){

    const n=chars[ch]||0;

    negativeScore+=n*weight;

    if(n>(FINAL_CHAR_MAX[ch]||1)){
      hardFail=true;
    }
  }

  /*
    最终成品的 12 个双字词槽必须全部唯一。
    不区分它来自场景词、事项词、神祇词还是玄奥词层；
    只要最终出现重复，就判定失败并重生成。
  */
  const slots=getTwoCharSlots(lines);

  const uniqueSlots=
    new Set(slots);

  const repeatedWords=
    Object.entries(words)
      .filter(([w,n])=>n>1)
      .map(([w,n])=>[w,n]);

  if(uniqueSlots.size!==slots.length){
    hardFail=true;
  }

  /*
    除韵脚外，任何单个汉字若出现 4 次以上，
    说明词库组合出现明显机械重复。
    “之、其”等本程序基本不会出现，因此这里直接硬控。
  */
  /*
    双字词内部也不允许 AA 型重复字，如“玄玄”“冥冥”。
  */
  const doubledSlots=
    slots.filter(w=>{
      const c=[...w];
      return c.length===2 && c[0]===c[1];
    });

  if(doubledSlots.length>0){
    hardFail=true;
  }

  const overusedChars=
    Object.entries(chars)
      .filter(([ch,n])=>
        n>=4 &&
        !["明","清","成","宁","安","通","心"].includes(ch)
      );

  if(overusedChars.length>0){
    hardFail=true;
  }

  const budget=
    finalNegativeBudget(hex,style);

  if(negativeScore>budget){
    hardFail=true;
  }

  return{
    ok:!hardFail,
    chars,
    words,
    negativeScore,
    budget,
    repeatedWords,
    doubledSlots,
    overusedChars
  };
}


/*
  从多个候选中选择最终成诗。

  正常情况下几次内即可通过。
  MAX_REROLL 只是保险，防止词库未来修改后出现死循环。
  即使 160 次都未通过，也返回“违规最少”的候选，
  而不是让网页卡死。
*/
const MAX_REROLL=320;

function poem(hex,topic,style,date){

  /*
    先正常生成一次。
    之后只修复重复的局部槽位，不重算整首。
  */
  rerollSalt=0;

  const original=
    poemOnce(
      hex,
      topic,
      style,
      date
    );

  let repaired=
    repairPoemUniqueChars(
      original,
      hex,
      style,
      dateSeed(date)
        +TOPIC[topic].seed*131
        +variant*409
        +STYLE_SALT[style]
    );

  /*
    第二轮保险：
    正常情况下第一轮即可达到 28 字全唯一。
    如果未来扩词库后仍有冲突，只再次修复冲突槽，
    依然不推倒整首。
  */
  for(let pass=1;pass<=8 && !allCharsUnique(repaired);pass++){

    repaired=
      repairPoemUniqueChars(
        repaired,
        hex,
        style,
        dateSeed(date)
          +TOPIC[topic].seed*137
          +variant*419
          +STYLE_SALT[style]
          +pass*5003
      );
  }

  /*
    负面词最终检查仍保留。
    但这里只对负面超标的结果做局部词槽修复，
    不重新生成整首。
  */
  const report=
    inspectPoem(
      repaired,
      hex,
      style
    );

  if(!report.ok){

    for(let pass=1;pass<=12;pass++){

      const next=
        repairPoemUniqueChars(
          repaired,
          hex,
          style,
          dateSeed(date)
            +pass*7907
            +STYLE_SALT[style]
        );

      repaired=next;

      const r=
        inspectPoem(
          repaired,
          hex,
          style
        );

      if(
        r.ok &&
        allCharsUnique(repaired)
      ){
        break;
      }
    }
  }

  rerollSalt=0;

  return repaired;
}

const MOVING={
  1:"事方萌芽，慎其初",
  2:"势渐成形，可徐进",
  3:"进退交争，戒躁",
  4:"将入新局，宜察",
  5:"位近其成，可决",
  6:"势已至极，当知变"
};

function judgement(hex){

  let s=
    GUA[hex.upper].luck+
    GUA[hex.lower].luck;

  if(hex.upper==="坎"||hex.lower==="坎")
    s--;

  if(hex.upper==="乾"||hex.lower==="乾")
    s++;

  if(s>=3)return "势盛，宜进";
  if(s>=1)return "有机，可行";
  if(s===0)return "势平，宜察";
  if(s===-1)return "有阻，宜缓";

  return "险象未解，宜守";
}

/* =========================================================
   V12 · Matrix / Mask Engine
   ---------------------------------------------------------
   目标：
   1) 八卦、六十四卦、事项全部整数编码；
   2) 高频约束使用预编译矩阵/bit mask；
   3) 28字唯一性不再反复构造 Set + filter 候选；
   4) 保留 V11 的词库、风格、神祇、稀有词与 UI。
========================================================= */

const MX={
  guaNames:["乾","兑","离","震","巽","坎","艮","坤"],
  guaIndex:Object.fromEntries(ORDER.map((g,i)=>[g,i])),
  topicNames:["career","love","wealth","study","travel","choice","general"],
  topicSeed:new Int8Array([1,2,3,4,5,6,7]),
  styleNames:["plain","classic","deep","arcane"],
  realms:REALMS,
  styleSalt:new Int16Array([101,307,701,1301]),
  // 行=下卦，列=上卦；元素为卦名字符串索引表中的位置。
  hexNameMatrix:[
    ["乾","夬","大有","大壮","小畜","需","大畜","泰"],
    ["履","兑","睽","归妹","中孚","节","损","临"],
    ["同人","革","离","丰","家人","既济","贲","明夷"],
    ["无妄","随","噬嗑","震","益","屯","颐","复"],
    ["姤","大过","鼎","恒","巽","井","蛊","升"],
    ["讼","困","未济","解","涣","坎","蒙","师"],
    ["遁","咸","旅","小过","渐","蹇","艮","谦"],
    ["否","萃","晋","豫","观","比","剥","坤"]
  ]
};
MX.topicIndex=Object.fromEntries(MX.topicNames.map((x,i)=>[x,i]));
MX.styleIndex=Object.fromEntries(MX.styleNames.map((x,i)=>[x,i]));

/* V27 · 取卦来源统一入口。默认仍由日期+事项起卦；遁演模式仅替换卦象来源。 */
function heavenHexagram(date,topic){
  const d=dateSeed(date)|0;
  const ti=MX.topicIndex[topic];
  const t=MX.topicSeed[ti];
  const u=((d%8)+8)%8;
  const l=(((d*3+t*7)%8)+8)%8;
  return{upper:MX.guaNames[u],lower:MX.guaNames[l],name:MX.hexNameMatrix[l][u],moving:(((d+t*11)%6)+6)%6+1,upperIndex:u,lowerIndex:l,topicIndex:ti,castingMode:'heaven'};
}
getHexagram=function(date,topic){
  const mode=document.getElementById('castingMode')?.value||'heaven';
  if(mode!=='manual')return heavenHexagram(date,topic);
  const upper=document.getElementById('manualUpper')?.value||'乾';

/* ---------------------------------------------------------
   字符 incidence matrix
   每个候选双字词 w_j 对应两列字符。
   使用 Uint32Array bitset 表示“已用字符 mask”。
--------------------------------------------------------- */
const MASK_ENGINE=(()=>{
  const allWords=[];
  const seenWord=new Set();
  const pushWord=(w)=>{
    if(typeof w!=="string")return;
    const c=[...w];
    if(c.length!==2 || c[0]===c[1] || seenWord.has(w))return;
    seenWord.add(w); allWords.push(w);
  };

  // 候选矩阵来源：卦专属词 + 风格修复词。
  for(const g of ORDER) for(const w of (UNIQUE_GUA_POOL[g]||[])) pushWord(w);
  for(const s of MX.styleNames) for(const w of (UNIQUE_REPAIR_POOL[s]||[])) pushWord(w);

  const charSet=new Set();
  for(const w of allWords) for(const ch of w) charSet.add(ch);
  for(const ch of UNIQUE_RHYME_POOL) charSet.add(ch);
  for(const ch of "祺祉祯祐穆晟晏煦昶翊璟璨颢颐颂") charSet.add(ch);

  const chars=[...charSet];
  const charIndex=Object.fromEntries(chars.map((c,i)=>[c,i]));
  const blocks=Math.ceil(chars.length/32);

  // A: N×2 的稀疏 incidence matrix（每个词恰好两个字符索引）。
  const A=new Int16Array(allWords.length*2);
  for(let j=0;j<allWords.length;j++){
    A[j*2]=charIndex[[...allWords[j]][0]];
    A[j*2+1]=charIndex[[...allWords[j]][1]];
  }

  // compatibility matrices: G(8×N), S(4×N)
  const G=Array.from({length:8},()=>new Uint8Array(allWords.length));
  const S=Array.from({length:4},()=>new Uint8Array(allWords.length));

  for(let j=0;j<allWords.length;j++){
    const w=allWords[j];
    for(let gi=0;gi<8;gi++) if((UNIQUE_GUA_POOL[ORDER[gi]]||[]).includes(w)) G[gi][j]=1;
    for(let si=0;si<4;si++) if((UNIQUE_REPAIR_POOL[MX.styleNames[si]]||[]).includes(w)) S[si][j]=1;
  }

  const used=new Uint32Array(blocks);
  const reset=()=>used.fill(0);
  const hasIndex=(idx)=>(used[idx>>>5]&(1<<(idx&31)))!==0;
  const addIndex=(idx)=>{used[idx>>>5]|=(1<<(idx&31));};
  const hasChar=(ch)=>{
    const idx=charIndex[ch];
    return idx===undefined ? false : hasIndex(idx);
  };
  const addChar=(ch)=>{
    const idx=charIndex[ch];
    if(idx!==undefined)addIndex(idx);
  };
  const addWord=(w)=>{for(const ch of [...w])addChar(ch);};

  const usable=(j)=>{
    const a=A[j*2], b=A[j*2+1];
    return !hasIndex(a) && !hasIndex(b);
  };

  /*
    M = M_gua OR M_style OR M_global，然后与 M_unique 相交。
    priority 0: 对应卦；1: 对应风格；2: 全局。
  */
  const chooseWord=(gua,style,seed)=>{
    const gi=MX.guaIndex[gua];
    const si=MX.styleIndex[style];
    const N=allWords.length;
    const start=Math.floor(seededNumber(seed)*N);

    for(let priority=0;priority<3;priority++){
      for(let step=0;step<N;step++){
        const j=(start+step*41)%N;
        const compatible=
          priority===0 ? G[gi][j]===1 :
          priority===1 ? S[si][j]===1 : true;
        if(compatible && usable(j)) return allWords[j];
      }
    }
    return null;
  };

  return{allWords,chars,charIndex,A,G,S,used,reset,hasChar,addChar,addWord,chooseWord};
})();

/* ---------------------------------------------------------
   Mask 版 28 字唯一生成器
   读取原始四句，但冲突发生时直接在 compatibility mask
   与 unique mask 的交集中选择，不进行全池反复 filter。
--------------------------------------------------------- */
repairPoemUniqueChars=function(lines,hex,style,seed){
  MASK_ENGINE.reset();
  const out=[];

  for(let li=0;li<4;li++){
    const c=[...(lines[li]||"")];
    const slots=[c.slice(0,2).join(""),c.slice(2,4).join(""),c.slice(4,6).join("")];
    const next=[];

    for(let si=0;si<3;si++){
      let w=slots[si];
      const wc=[...w];
      const conflict=wc.length!==2 || wc[0]===wc[1] || wc.some(ch=>MASK_ENGINE.hasChar(ch));
      if(conflict){
        const gua=si===0?hex.upper:hex.lower;
        w=MASK_ENGINE.chooseWord(gua,style,seed+li*1009+si*137) ||
          chooseUniqueReplacement(w,gua,style,new Set(),seed+li*1009+si*137);
      }
      MASK_ENGINE.addWord(w);
      next.push(w);
    }

    let rhyme=c[6];
    if(!rhyme || MASK_ENGINE.hasChar(rhyme)){
      const start=Math.floor(seededNumber(seed+li*2017+1703)*UNIQUE_RHYME_POOL.length);
      let found=null;
      for(let k=0;k<UNIQUE_RHYME_POOL.length;k++){
        const ch=UNIQUE_RHYME_POOL[(start+k*7)%UNIQUE_RHYME_POOL.length];
        if(!MASK_ENGINE.hasChar(ch)){found=ch;break;}
      }
      rhyme=found || rhyme || "吉";
    }
    MASK_ENGINE.addChar(rhyme);
    out.push(next.join("")+rhyme);
  }
  return out;
};

  const hasChar=c=>{const i=V15_CHAR_INDEX[c];return i===undefined?false:has(i);};

    const gi=MX.guaIndex[gua],ti=MX.topicIndex[topic],si=V15_SLOTS.indexOf(slot);

/* V34 page controller: page 1 disappears immediately after invocation. */
const V33_PAGES={
  ask:null,stage:null,res:null,veil:null,
  q(){
    const v=parseInt(document.getElementById("realm")?.value||"0",10);
    return Math.max(0,Math.min(7,Number.isFinite(v)?v:0));
  },
  sync(){
    const q=this.q(); document.documentElement.dataset.realmQ=String(q);
    const names=["练气","筑基","金丹","元婴","化神","炼虚","合体","大乘"];
    const m=document.getElementById("resultRealmMark"); if(m)m.textContent=names[q]+" · 天机已定";
  },
  begin(){
    this.sync();
    /* Immediate structural switch: the settings page is gone before animation starts. */
    this.ask.hidden=true;
    this.res.hidden=true;
    this.stage.hidden=false;
    window.scrollTo(0,0);
    this.veil?.classList.remove("returning","on");
    void this.veil?.offsetWidth;
    this.veil?.classList.add("on");
  },
  reveal(){
    this.stage.hidden=true;
    this.res.hidden=false;
    this.res.classList.remove("page-enter");
    void this.res.offsetWidth;
    this.res.classList.add("page-enter");
    window.scrollTo(0,0);
    requestAnimationFrame(()=>setTimeout(()=>this.veil?.classList.remove("on"),120));
  },
  back(){
    if(this.veil?.classList.contains("returning"))return;
    this.veil?.classList.remove("on");
    this.veil?.classList.add("returning","on");
    /* Switch beneath the cloud near its visual midpoint, then dissolve cloud slowly. */
    setTimeout(()=>{
      this.res.hidden=true;
      this.stage.hidden=true;
      this.ask.hidden=false;
      this.ask.classList.remove("v34-return");
      void this.ask.offsetWidth;
      this.ask.classList.add("v34-return");
      window.scrollTo(0,0);
    },545);
    setTimeout(()=>{
      this.veil?.classList.remove("on");
    },1030);
    setTimeout(()=>{
      this.veil?.classList.remove("returning");
      this.ask.classList.remove("v34-return");
    },1680);
  },
  init(){
    this.ask=document.getElementById("askPage");
    this.stage=document.getElementById("castingStage");
    this.res=document.getElementById("resultPage");
    this.veil=document.getElementById("cloudVeil");
    document.getElementById("backToAsk")?.addEventListener("click",()=>this.back());
    document.getElementById("realm")?.addEventListener("change",()=>this.sync());
    this.sync();
  }
};
V33_PAGES.init();
window.V33_PAGES=V33_PAGES;


/* V38 intro controller — mathematical jade texture. */
const V38_INTRO={
  canvas:null,ctx:null,raf:0,start:0,
  resize(){
    const dpr=Math.min(devicePixelRatio||1,2), w=innerWidth,h=innerHeight;
    this.canvas.width=Math.floor(w*dpr);this.canvas.height=Math.floor(h*dpr);
    this.canvas.style.width=w+"px";this.canvas.style.height=h+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  draw(t){
    if(!this.ctx)return;
    const c=this.ctx,w=innerWidth,h=innerHeight;
    c.clearRect(0,0,w,h); c.save();
    c.font='13px "Times New Roman",serif';c.textAlign="center";c.textBaseline="middle";
    const formulas=["∇²φ=0","∂u/∂t=κ∇²u","det(A−λI)=0","δS=0","∮Γ dz=0","e^{iπ}+1=0","∇·σ+f=0","dW=σ:dε","∂ρ/∂t+∇·(ρv)=0","F=ma"];
    const tt=t*.00012;
    for(let j=0;j<11;j++){
      for(let i=0;i<7;i++){
        const x=(i+.5)*w/7+18*Math.sin(tt*3+j*.61+i*.37);
        const y=(j+.5)*h/11+11*Math.cos(tt*2+i*.43-j*.29);
        const a=.055+.055*(.5+.5*Math.sin(tt*5+i*.8+j*.55));
        c.fillStyle=`rgba(47,89,61,${a})`;
        c.save();c.translate(x,y);c.rotate(.035*Math.sin(i+j+tt*4));
        c.fillText(formulas[(i*3+j*5)%formulas.length],0,0);c.restore();
      }
    }
    c.restore();
    this.raf=requestAnimationFrame(x=>this.draw(x));
  },
  transferGlow(){
    const buttons=[...document.querySelectorAll("#askPage button")];
    const b=buttons.find(x=>/叩问天机/.test(x.textContent||""));
    if(b)b.dataset.heavenGlow="1";
  },
  init(){
    const gate=document.getElementById("introGate");
    this.canvas=document.getElementById("jadeFormula");if(!gate||!this.canvas)return;
    this.ctx=this.canvas.getContext("2d");this.resize();addEventListener("resize",()=>this.resize(),{passive:true});
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduce)this.raf=requestAnimationFrame(t=>this.draw(t)); else this.draw(0);
    const introTime=reduce?850:2140;
    /* “天機”先显，金光从字形内部短促透出，一闪即过，然后进入第一页。 */
    /* V47 exact staging:
       title settles, then remains fully readable for 1 s;
       0.5 s text dissolve;
       only after that does the background/page palette transition begin. */
    const settle=reduce?180:760;
    const hold=reduce?450:1000;
    const textOut=reduce?220:500;
    const bgShift=reduce?700:2800;

    setTimeout(()=>{
      gate.classList.add("text-out");
      setTimeout(()=>{
        const ask=document.getElementById("askPage");
        this.transferGlow();
        if(ask) ask.classList.add("v47-arrive");
        gate.classList.add("bg-shift");
        document.body.classList.remove("intro-lock");
        setTimeout(()=>{
          cancelAnimationFrame(this.raf);
          gate.remove();
          if(ask) ask.classList.remove("v47-arrive");
        },bgShift+80);
      },textOut);
    },settle+hold);
  }
};
V38_INTRO.init();
window.V38_INTRO=V38_INTRO;

</script>

 travel:["行途","客路","关津","归舟","旅次"],choice:["去取","诸端","机候","趋向","所择"],
 general:["人事","时势","所由","生计","所终"]};return v55pick(m[t]||m.general,s)
}
function v55act(t,s){
 const m={career:["待迁擢","图有成","且徐进","候佳音"],love:["问归期","待重会","守盟约","莫轻离"],
 wealth:["慎市易","宜蓄积","缓图利","守家计"],study:["勤研求","试文墨","宜温习","待题名"],
 travel:["缓登程","问归舟","候天晴","莫趁潮"],choice:["审去取","且徐图","俟机候","莫遽行"],
 general:["察时势","且从容","俟其变","守其常"]};return v55pick(m[t]||m.general,s)
}
function v55rhymes(s){
 const ks=Object.keys(V55_SONGCI.rhyme),f=V55_SONGCI.rhyme[v55pick(ks,s)];
 let a=v55pick(f,s+7),b=v55pick(f,s+17),c=v55pick(f,s+29);
 if(b===a)b=f[(f.indexOf(a)+1)%f.length];if(c===a||c===b)c=f[(f.indexOf(b)+1)%f.length];return[a,b,c]
}
function v55realm(q,s){
 if(q<=1)return v55pick(["柴扉","客舍","市桥","书窗","短亭","村店"],s);
 if(q<=3)return v55pick(V55_SONGCI.scene,s);
 if(q<=5)return v55pick(["云岫","兰皋","远浦","沧浪","月浦","烟渚"],s);
 return v55pick(["云汉","星河","碧落","天末","月窟","霄汉"],s)
}
function generateSongci(hex,topic,style,date){
 const q=currentRealmLevel,b=dateSeed(date)+TOPIC[topic].seed*431+hex.upperIndex*1451+hex.lowerIndex*2371+hex.moving*4211+q*1999+variant*8017;
 const [r2,r4,r6]=v55rhymes(b+101),t=v55pick(V55_SONGCI.time,b+1),w=v55pick(V55_SONGCI.weather,b+5),
 sc=v55realm(q,b+9),ob=v55pick(V55_SONGCI.object,b+13),mo=v55pick(V55_SONGCI.motion,b+17),
 mind=v55pick(V55_SONGCI.mind,b+23),turn=v55pick(V55_SONGCI.turn,b+31),tw=v55topic(topic,b+37),act=v55act(topic,b+43),
 close=v55pick(V55_SONGCI.close,b+47),sc2=v55realm(Math.min(7,q+1),b+59);
 return[
  v55chars(t+w,5,"轻"),
  v55tail(sc+mo,5,r2),
  v55chars(turn+ob+mind,7,"意"),
  v55tail(sc2+v55pick(V55_SONGCI.motion,b+61),5,r4),
  v55chars(tw+act,5,"徐"),
  v55tail(close+v55pick(["从容","徐徐","未晚","有信","可待"],b+71),7,r6)
 ];
}
const V55_PREVIOUS_POEM=poem;
poem=function(hex,topic,style,date){
 const literary=document.getElementById("literaryStyle")?.value||"oracle";
 if(literary==="songci")return generateSongci(hex,topic,style,date);

<script>
/* =========================================================
   V56 · 万象词网 Unified Lexicon Graph
   目的：不再让 V17/V28/V29/V30/V49/V50/V51/V52 等词库各自孤立。
   所有可见词条在运行时建立统一索引，并通过：
   realm / topic / semantic / source / tag / character / affinity
   互联。原词库仍保留，因此兼容既有卦辭 · 古占、楚辭 · 騷韻、宋詞 · 清韻生成器。
========================================================= */
const V56_LEXICON_GRAPH={
  nodes:[],
  byText:new Map(),
  byTag:new Map(),
  bySemantic:new Map(),
  byRealm:Array.from({length:8},()=>[]),
  byTopic:new Map(),
  byChar:new Map(),
  edges:new Map(),

  norm(x){
    const e={...x};
    e.text=String(e.text||"");
    e.tags=[...new Set([...(e.tags||[]),e.source||"unknown"].filter(Boolean))];
    e.semantic=e.semantic||"image";
    e.realmMin=Math.max(0,Math.min(7,Number.isFinite(+e.realmMin)?+e.realmMin:0));
    e.realmPeak=Math.max(e.realmMin,Math.min(7,Number.isFinite(+e.realmPeak)?+e.realmPeak:3));
    e.realmMax=Math.max(e.realmPeak,Math.min(7,Number.isFinite(+e.realmMax)?+e.realmMax:7));
    e.rarity=+e.rarity||0;e.mystery=+e.mystery||0;e.weight=+e.weight||1;
    return e;
  },
  add(raw){
    const e=this.norm(raw); if(!e.text)return null;
    let n=this.byText.get(e.text);
    if(n){
      n.tags=[...new Set([...n.tags,...e.tags])];
      n.sources=[...new Set([...n.sources,e.source||"unknown"])];
      n.semantics=[...new Set([...n.semantics,e.semantic])];
      n.realmMin=Math.min(n.realmMin,e.realmMin);
      n.realmMax=Math.max(n.realmMax,e.realmMax);
      n.weight=Math.max(n.weight,e.weight);
      return n;
    }
    n={id:this.nodes.length,text:e.text,tags:e.tags,sources:[e.source||"unknown"],
       semantics:[e.semantic],realmMin:e.realmMin,realmPeak:e.realmPeak,realmMax:e.realmMax,
       rarity:e.rarity,mystery:e.mystery,weight:e.weight,raw:e};
    this.nodes.push(n);this.byText.set(n.text,n);this.edges.set(n.id,new Map());
    return n;
  },
  index(){
    this.byTag.clear();this.bySemantic.clear();this.byTopic.clear();this.byChar.clear();
    this.byRealm=Array.from({length:8},()=>[]);
    const topics=["career","love","wealth","study","travel","choice","general"];
    for(const n of this.nodes){
      for(const tag of n.tags){
        if(!this.byTag.has(tag))this.byTag.set(tag,[]);
        this.byTag.get(tag).push(n);
        if(topics.includes(tag)){
          if(!this.byTopic.has(tag))this.byTopic.set(tag,[]);
          this.byTopic.get(tag).push(n);
        }
      }
      for(const sem of n.semantics){
        if(!this.bySemantic.has(sem))this.bySemantic.set(sem,[]);
        this.bySemantic.get(sem).push(n);
      }
      for(let q=n.realmMin;q<=n.realmMax;q++)this.byRealm[q].push(n);
      for(const ch of [...n.text]){
        if(!this.byChar.has(ch))this.byChar.set(ch,[]);
        this.byChar.get(ch).push(n);
      }
    }
  },
  link(a,b,w,why){
    if(!a||!b||a.id===b.id)return;
    const put=(x,y)=>{
      const m=this.edges.get(x.id),old=m.get(y.id);
      if(!old||old.w<w)m.set(y.id,{node:y,w,why});
    };
    put(a,b);put(b,a);
  },
  connect(){
    /* Shared tags/semantics create the semantic web. Limit buckets to avoid O(N²) explosion. */
    const connectBucket=(arr,w,why,cap=18)=>{
      for(let i=0;i<arr.length;i++){
        for(let j=i+1;j<Math.min(arr.length,i+1+cap);j++)this.link(arr[i],arr[j],w,why);
      }
    };
    for(const [tag,arr] of this.byTag){
      if(["unknown","archaic","revived","preqin"].includes(tag))continue;
      connectBucket(arr,1.35,"tag:"+tag,14);
    }
    for(const [sem,arr] of this.bySemantic)connectBucket(arr,1.10,"semantic:"+sem,10);

    /* Shared rare characters provide a weaker philological relation. */
    for(const [ch,arr] of this.byChar){
      if(arr.length>1&&arr.length<=10)connectBucket(arr,.38,"char:"+ch,5);
    }

    /* Explicit bridges: 天—地—人、事项—古语、文体—意象. */
    const bridges=[
      ["celestial","materia-medica",.52,"天地"],["materia-medica","acupoint",.52,"地人"],
      ["celestial","acupoint",.48,"天人"],["fragrance","chuci",1.25,"香草骚体"],
      ["terrain","chuci",1.15,"山川骚体"],["scene","songci",1.10,"词景"],
      ["mind","songci",1.10,"词情"],["secular","qi-realm",1.30,"练气人间"],
      ["xianxia","daozang",1.05,"仙道"],["omen","celestial",.92,"星占"]
    ];
    for(const [ta,tb,w,why] of bridges){
      const A=this.byTag.get(ta)||[],B=this.byTag.get(tb)||[];
      for(let i=0;i<Math.min(A.length,30);i++)
        for(let j=0;j<Math.min(B.length,8);j++)this.link(A[i],B[j],w,why);
    }
  },
  affinity(node,ctx={}){
    let z=node.weight||1;
    const q=Math.max(0,Math.min(7,+ctx.realm||0));
    if(q<node.realmMin||q>node.realmMax)return 0;
    z*=1+Math.max(0,1-Math.abs(q-node.realmPeak)/4)*.42;
    if(ctx.topic&&(node.tags.includes(ctx.topic)))z*=1.75;
    if(ctx.semantic&&node.semantics.includes(ctx.semantic))z*=1.55;
    if(ctx.style){
      if(ctx.style==="chuci"&&(node.tags.includes("chuci")||node.tags.includes("fragrance")||node.tags.includes("terrain")))z*=1.48;
      if(ctx.style==="songci"&&(node.tags.includes("songci")||node.tags.includes("scene")||node.tags.includes("mind")))z*=1.42;
      if(ctx.style==="oracle"&&(node.tags.includes("gua")||node.tags.includes("omen")||node.tags.includes("preqin")))z*=1.34;
    }
    return z;
  },
  related(text,ctx={},limit=16){
    const n=this.byText.get(text);if(!n)return[];
    const out=[];
    for(const {node,w,why} of this.edges.get(n.id).values()){
      const score=w*this.affinity(node,ctx);
      if(score>0)out.push({text:node.text,score,why,node});
    }
    return out.sort((a,b)=>b.score-a.score).slice(0,limit);
  },
  candidates(ctx={},limit=120){
    const q=Math.max(0,Math.min(7,+ctx.realm||0));
    let arr=this.byRealm[q]||this.nodes;
    return arr.map(node=>({node,score:this.affinity(node,ctx)}))
      .filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,limit);
  }
};

/* Import every accessible entry already registered in the common bank. */
(function buildV56(){
  const bank=window.LEXICON_BANK;
  let imported=0;
  if(bank){
    const possible=[bank.items,bank.entries,bank.words,bank.data,bank.list];
    for(const p of possible){
      if(Array.isArray(p)){for(const e of p){V56_LEXICON_GRAPH.add(e);imported++}break;}
    }
    /* Some implementations expose all() instead of a public array. */
    if(!imported&&typeof bank.all==="function"){
      const a=bank.all();if(Array.isArray(a))for(const e of a){V56_LEXICON_GRAPH.add(e);imported++}
    }
  }

  /* Guaranteed adapters for the later explicit banks. Duplicate texts merge rather than repeat. */
  const addBank=(obj,source,tag)=>{
    if(!obj)return;
    for(const [cat,words] of Object.entries(obj)){
      if(!Array.isArray(words))continue;
      for(const text of words)V56_LEXICON_GRAPH.add({
        text,source,tags:["archaic",tag,cat],semantic:"image",
        realmMin:0,realmPeak:3,realmMax:7,weight:.65
      });
    }
  };
  addBank(window.V49_REVIVED_ARCHAIC,"revived-archaic-v49","revived");
  addBank(window.V50_REVIVED_WORDS,"revived-archaic-v50","syntax-ready");
  addBank(window.V51_CLASSICAL_NATURE_LEXICON,"classical-nature-v51","nature");
  addBank(window.V52_QI_SECULAR,"qi-secular-v52","secular");

  V56_LEXICON_GRAPH.index();
  V56_LEXICON_GRAPH.connect();

  /* Expose graph through the existing app architecture. */
  window.LEXICON_GRAPH=V56_LEXICON_GRAPH;
  if(window.TIANDAO_APP){
    window.TIANDAO_APP.lexiconGraph=V56_LEXICON_GRAPH;
    window.TIANDAO_APP.relatedWords=(text,ctx,limit)=>V56_LEXICON_GRAPH.related(text,ctx,limit);
    window.TIANDAO_APP.lexiconCandidates=(ctx,limit)=>V56_LEXICON_GRAPH.candidates(ctx,limit);
  }
})();

/* Cross-style semantic bridges used by future generators.
   Same concept can now surface differently according to literary form. */
window.V56_CONCEPT_BRIDGES=Object.freeze({
  "前程":["官途","行途","客路","所事","迁擢","登庸"],
  "机缘":["际会","遇合","邂逅","休征","星纪","招摇"],
  "等待":["俟候","延伫","淹留","宜俟","未迟","可期"],
  "归返":["聿归","言旋","归舟","归期","回翔","旋归"],
  "情缘":["嘉耦","情契","盟约","好逑","琴瑟","于归"],
  "学业":["课业","试艺","研求","覃思","涵泳","登第"],
  "财富":["泉布","殖货","蓄积","货殖","懋迁","羡余"],
  "险阻":["艰阻","蹇滞","屯邅","否塞","暌隔","关津"],
  "转机":["剥复","消息","消长","云开","潮生","渐通"],
  "天象":["紫微","太微","天市","河鼓","招摇","摄提"],
  "地物":["杜若","蕙茝","黄精","菖蒲","丹砂","空青"],
  "人身":["百会","神庭","灵台","命门","神阙","涌泉"]
});

<script>
/* =========================================================
   V57 · 词脉深联
   V56 建“词—标签”图；V57 再建立“概念—意象—动作—结果—文体”
   多跳关系，使一句选出的词可以影响下一句，而非各句独立抽取。
========================================================= */
const V57_SEMANTIC_AXES={
  water:["坎","水","江","河","川","津","浦","洲","汀","潮","雨","露","沧浪","洞庭","关津"],
  fire:["离","火","日","阳","光","烛","灯","丹","朱","荧惑","朱雀"],
  wood:["巽","震","木","林","兰","蕙","桂","桑","若木","扶桑","草","芳"],
  metal:["乾","兑","金","玉","珩","璜","钟","磬","白虎","太白"],
  earth:["坤","艮","土","山","原","隰","田","畴","石","黄","田舍"],
  ascent:["升","登","陟","骞","举","迁","擢","进","翔","通天","百会"],
  descent:["降","落","归","还","退","沉","暮","下","坠"],
  opening:["开","启","明","通","亨","达","解","释","云开","渐通"],
  closing:["阖","闭","塞","困","滞","晦","暮","否塞","艰阻"],
  gathering:["聚","会","合","契","耦","同","集","归","盟","琴瑟"],
  separation:["离","别","暌","散","隔","远","送","歧","羁","客"],
  stillness:["静","守","俟","止","宁","安","定","寂","澹","坐忘"],
  motion:["行","征","迈","涉","游","翔","转","迁","舟","车","旅"],
  study:["书","学","文","研","试","策","经","义","塾","庠","题名"],
  wealth:["财","货","泉","布","市","贾","殖","蓄","仓","廪","粟"],
  career:["官","仕","禄","职","迁","擢","府","署","令","猷","绩"],
  affection:["情","缘","思","盟","耦","琴","瑟","归宁","好逑","相思"]
};

const V57_GUA_AXES={
  "乾":["metal","ascent","opening"],
  "兑":["metal","gathering","opening"],
  "离":["fire","opening"],
  "震":["wood","motion","ascent"],
  "巽":["wood","motion"],
  "坎":["water","closing","motion"],
  "艮":["earth","stillness","closing"],
  "坤":["earth","stillness","gathering"]
};
const V57_TOPIC_AXES={
  career:["career","ascent","opening"],
  love:["affection","gathering"],
  wealth:["wealth","gathering"],
  study:["study","stillness","opening"],
  travel:["motion","water"],
  choice:["opening","closing","stillness"],
  general:["opening","stillness"]
};

(function deepenGraph(){
  const G=window.LEXICON_GRAPH;if(!G)return;

  /* Infer conceptual axes from characters, tags and exact concept bridges. */
  for(const n of G.nodes){
    n.axes=n.axes||[];
    const hay=n.text+" "+n.tags.join(" ")+" "+n.semantics.join(" ");
    for(const [axis,keys] of Object.entries(V57_SEMANTIC_AXES)){
      if(keys.some(k=>hay.includes(k)))n.axes.push(axis);
    }
    n.axes=[...new Set(n.axes)];
  }

  /* Same conceptual axis creates a stronger relation than mere shared character. */
  const axisBuckets={};
  for(const n of G.nodes)for(const a of n.axes)(axisBuckets[a]??=[]).push(n);
  for(const [axis,arr] of Object.entries(axisBuckets)){
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<Math.min(arr.length,i+13);j++)G.link(arr[i],arr[j],1.58,"axis:"+axis);
    }
  }

  /* Concept bridge entries are now actual graph edges, not only a lookup table. */
  for(const [concept,words] of Object.entries(window.V56_CONCEPT_BRIDGES||{})){
    const ns=words.map(w=>G.byText.get(w)).filter(Boolean);
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++)G.link(ns[i],ns[j],2.05,"concept:"+concept);
  }

  /* Cross-domain correspondences: not historical equivalence claims;
     they are generation affinities for coherent imagery. */
  const correspondences=[
    ["water","travel"],["water","stillness"],["fire","opening"],
    ["wood","study"],["wood","ascent"],["metal","career"],
    ["earth","wealth"],["earth","stillness"],
    ["gathering","affection"],["separation","affection"],
    ["ascent","career"],["opening","study"]
  ];
  for(const [a,b] of correspondences){
    const A=axisBuckets[a]||[],B=axisBuckets[b]||[];
    for(let i=0;i<Math.min(A.length,24);i++)
      for(let j=0;j<Math.min(B.length,7);j++)G.link(A[i],B[j],.82,"correspond:"+a+"→"+b);
  }

  G.contextAxes=function(ctx={}){
    return [...new Set([
      ...(V57_TOPIC_AXES[ctx.topic]||[]),
      ...(V57_GUA_AXES[ctx.upper]||[]),
      ...(V57_GUA_AXES[ctx.lower]||[])
    ])];
  };

  G.contextScore=function(node,ctx={}){
    let z=this.affinity(node,ctx);
    if(!z)return 0;
    const axes=this.contextAxes(ctx);
    const overlap=(node.axes||[]).filter(a=>axes.includes(a)).length;
    z*=1+overlap*.32;
    if(ctx.previous){
      const p=this.byText.get(ctx.previous);
      const e=p&&this.edges.get(p.id)?.get(node.id);
      if(e)z*=1+Math.min(1.6,e.w*.42);
    }
    return z;
  };

  /* Multi-hop semantic walk:
     selected word -> related word -> related word,
     while preserving realm/topic/style/gua context. */
  G.walk=function(startText,ctx={},steps=3,beam=8){
    let cur=this.byText.get(startText);
    if(!cur){
      const c=this.candidates(ctx,1);cur=c[0]?.node;
    }
    if(!cur)return[];
    const path=[cur.text],used=new Set(path);
    for(let step=0;step<steps;step++){
      const opts=[];
      for(const {node,w,why} of this.edges.get(cur.id).values()){
        if(used.has(node.text))continue;
        const score=w*this.contextScore(node,{...ctx,previous:cur.text});
        if(score>0)opts.push({node,score,why});
      }
      opts.sort((a,b)=>b.score-a.score);
      const top=opts.slice(0,beam);if(!top.length)break;
      /* deterministic but not always top-1 */
      const seed=(ctx.seed||1)+(step+1)*7919+cur.id*101;
      const idx=Math.min(top.length-1,Math.floor(seededNumber(seed)*Math.min(3,top.length)));
      cur=top[idx].node;used.add(cur.text);path.push(cur.text);
    }
    return path;
  };

  /* Build a four-part semantic chain suitable for oracle/chuci/songci:
     scene -> motion/mind -> topic -> outcome. */
  G.semanticChain=function(ctx={}){
    const order=ctx.style==="chuci"
      ?["image","motion","mind","outcome"]
      :ctx.style==="songci"
      ?["scene","mind","topic","outcome"]
      :["scene","topic","motion","outcome"];
    const out=[];let prev=null;
    for(let i=0;i<order.length;i++){
      const sem=order[i],pool=this.bySemantic.get(sem)||this.byRealm[ctx.realm||0]||[];
      let scored=pool.map(node=>({node,score:this.contextScore(node,{...ctx,semantic:sem,previous:prev})}))
        .filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,24);
      if(!scored.length)continue;
      const seed=(ctx.seed||1)+i*4099;
      const pick=scored[Math.floor(seededNumber(seed)*Math.min(5,scored.length))];
      if(pick){out.push(pick.node.text);prev=pick.node.text;}
    }
    return out;
  };

  if(window.TIANDAO_APP){
    TIANDAO_APP.lexiconWalk=(word,ctx,steps)=>G.walk(word,ctx,steps);
    TIANDAO_APP.semanticChain=ctx=>G.semanticChain(ctx);
  }
})();

/* Style-aware bridge vocabulary:
   a single semantic nucleus can be realized differently without breaking the graph. */
window.V57_STYLE_REALIZATION=Object.freeze({
  "等待":{
    oracle:["俟","宜俟","待时","攸待"],
    chuci:["延伫","夷犹","淹留","容与"],
    songci:["未迟","可待","莫急","且住"]
  },
  "前进":{

<script>
/* =========================================================
   V58 · 一库多体
   修正 V54–V57 的方向：
   “卦辭 · 古占 / 楚辭 · 騷韻 / 宋詞 · 清韻”不再各占一套固定意象词库。
   所有词进入同一公共池；文体只规定句法、节奏、虚字、押韵和组合方式。
   同一词（兰、舟、星、官途、柴扉、紫微……）原则上可被任何文体使用。
========================================================= */
(function V58_SHARED_LEXICON(){
  const G=window.LEXICON_GRAPH;
  if(!G)return;

  /* 1. 文体标签不再作为排他过滤器，只保留为“出处/历史亲和度”元数据。 */
  G.affinity=function(node,ctx={}){
    let z=node.weight||1;
    const q=Math.max(0,Math.min(7,+ctx.realm||0));
    if(q<node.realmMin||q>node.realmMax)return 0;

    z*=1+Math.max(0,1-Math.abs(q-node.realmPeak)/4)*.36;
    if(ctx.topic&&node.tags.includes(ctx.topic))z*=1.52;
    if(ctx.semantic&&node.semantics.includes(ctx.semantic))z*=1.38;

    /* 文体只有轻微偏好，不禁止跨文体取词。 */
    if(ctx.style==="chuci"&&node.tags.includes("chuci"))z*=1.08;
    if(ctx.style==="songci"&&node.tags.includes("songci"))z*=1.08;
    if(ctx.style==="oracle"&&(node.tags.includes("gua")||node.tags.includes("preqin")))z*=1.08;

    /* 古语、复苏词、世俗词、星官、本草、穴位均属于共同资源。 */
    if(node.tags.some(t=>["archaic","revived","secular","celestial","materia-medica","acupoint","nature"].includes(t)))z*=1.06;
    return z;
  };

  /* 2. 统一候选池：realm/topic/semantic 只是加权，不再按“楚辭 · 騷韻意象/宋詞 · 清韻意象”切库。 */
  G.sharedCandidates=function(ctx={},limit=160){
    const q=Math.max(0,Math.min(7,+ctx.realm||0));
    const arr=this.byRealm[q]||this.nodes;
    return arr.map(node=>({node,score:this.contextScore?this.contextScore(node,ctx):this.affinity(node,ctx)}))
      .filter(x=>x.score>0)
      .sort((a,b)=>b.score-a.score)
      .slice(0,limit);
  };

  G.pickShared=function(ctx={},seed=1,exclude=[]){
    const ban=new Set(exclude);
    let arr=this.sharedCandidates(ctx,180).filter(x=>!ban.has(x.node.text));
    if(!arr.length)return "";
    /* 从高相关候选前部确定性抽取，兼顾一致性与变化。 */
    const top=arr.slice(0,Math.min(28,arr.length));
    let total=top.reduce((a,x)=>a+Math.max(.001,x.score),0);
    let r=seededNumber(seed)*total;
    for(const x of top){r-=Math.max(.001,x.score);if(r<=0)return x.node.text}
    return top[0].node.text;
  };

  /* 3. 统一“意脉”：先由卦/事项/境界选概念，再由文体决定怎么排句。 */
  G.sharedMotif=function(ctx={}){
    const axes=this.contextAxes?this.contextAxes(ctx):[];
    const seed=ctx.seed||1;
    const motif=[];
    let prev=null;
    const sems=["scene","image","topic","motion","mind","outcome"];
    for(let i=0;i<sems.length;i++){
      const word=this.pickShared({...ctx,semantic:sems[i],previous:prev},seed+i*3571,motif);
      if(word){motif.push(word);prev=word;}
    }
    return {axes,words:motif};
  };

  /* 4. 文体规则只处理“形”，不拥有“物象”。
        这些 profile 不包含专属词汇。 */
  window.V58_STYLE_GRAMMAR=Object.freeze({
    oracle:{
      linePattern:[7,7,7,7],
      caesura:[2,2,2,1],
      syntax:["scene","topic","motion","outcome"],
      particleMode:"preqin",
      rhyme:"family"
    },
    chuci:{
      linePattern:[7,7,7,7],
      caesura:[3,1,3],
      syntax:["scene","topic","motion","outcome"],
      particleMode:"兮",
      rhyme:"paired-tail"
    },
    songci:{
      linePattern:[5,5,7,5,5,7],
      caesura:[[2,3],[2,3],[2,2,3],[2,3],[2,3],[2,2,3]],
      syntax:["scene","image","mind","scene","topic","outcome"],
      particleMode:"ci",
      rhyme:"single-rhyme"
    }
  });

  /* 5. 对旧 style manifest 去除“专属词库”语义。
        lexiconTags 改成 shared，明确三体共库。 */
  if(window.LITERARY_STYLE_REGISTRY){
    for(const id of ["oracle","chuci","songci"]){
      const m=LITERARY_STYLE_REGISTRY[id];
      if(m){
        m.lexiconTags=["shared"];
        m.lexiconPolicy="shared-weighted";
        m.note=(m.note||"")+"；V58起与其他文体完全共用词库，文体仅约束形式。";
      }
    }
  }

  /* 6. 旧 V57 style realization 变为“语法实现提示”，不再视为词汇边界。 */
  window.V58_SHARED_POLICY=Object.freeze({
    principle:"one-lexicon-many-forms",
    vocabulary:"shared",
    styleOwns:["linePattern","syntax","caesura","particles","rhyme","tone"],
    styleDoesNotOwn:["imagery","objects","celestial","plants","acupoints","secular","xianxia"],
    realmRole:"weight",
    topicRole:"weight",
    guaRole:"semantic-bias"
  });

  if(window.TIANDAO_APP){
    TIANDAO_APP.sharedLexicon=G;
    TIANDAO_APP.pickSharedWord=(ctx,seed,exclude)=>G.pickShared(ctx,seed,exclude);
    TIANDAO_APP.sharedMotif=ctx=>G.sharedMotif(ctx);
    TIANDAO_APP.styleGrammar=window.V58_STYLE_GRAMMAR;
  }
})();
</script>
